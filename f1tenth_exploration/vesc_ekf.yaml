# Copy of f1tenth_stack/config/vesc.yaml with ONE change, marked below.
# Passed to bringup via:  ros2 launch f1tenth_stack bringup_launch.py vesc_config:=<this>
/**:
  ros__parameters:
    # erpm = speed_to_erpm_gain * speed (m/s) + speed_to_erpm_offset
    # Negative: the motor is wired so positive eRPM drives the car BACKWARD
    # (confirmed 2026-10-17 from lidar: forward commands grew the front range).
    # The stack's own vesc.yaml got the same flip on 2026-08-25.
    speed_to_erpm_gain: -4614.0
    speed_to_erpm_offset: 0.0
    # servo (0..1) = steering_angle_to_servo_gain * steering angle (rad) + offset
    steering_angle_to_servo_gain: -1.2135
    # 0.58 — MEASURED on this car, confirmed by straight-line driving on
    # 2026-08-21. The stock 0.5304 veered noticeably LEFT, and so did every
    # value up to 0.5345 (the old ceiling imposed by servo_max: 0.85).
    #
    # Direction: HIGHER offset steers RIGHT, lower steers LEFT. This follows
    # from the negative gain — servo = -1.2135*delta + offset, so a larger
    # offset means a larger servo value, which is right lock.
    #
    # 0.58 is 4.4 deg of right bias past stock, which is a lot for a trim value.
    # It is worth checking the steering linkage and servo horn at some point:
    # a centre this far out often means a tie rod or knuckle took a knock, and
    # correcting it mechanically would give the trim range back.
    #
    # NOTE: any trim measured before 2026-08-21 is void — the servo cable was
    # intermittently seated, which produced bimodal readings I wrongly blamed
    # on backlash.
    steering_angle_to_servo_offset: 0.58

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    # 0.15 / 0.90. servo_max is raised from the stock 0.85 because this car's
    # steering centre sits at offset 0.58, and full right lock there needs
    # servo = 0.58 + 1.2135*0.26 = 0.8955. With the stock 0.85 the right lock
    # would clamp and the car would lose right steering travel.
    # 0.90 is the MINIMUM that fits 0.8955 — deliberately not left at the 0.95
    # used during the limit probe, because commanding past the servo's
    # mechanical stop stalls it, and it draws stall current with no temperature
    # feedback (temp_motor reads 0.0 on this VESC).
    servo_min: 0.15
    servo_max: 0.90

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # >>> THE ONE CHANGE <<<
    # false, because ekf_filter_node publishes odom -> base_link. Two nodes
    # broadcasting the same transform makes TF non-deterministic and the map
    # will tear. vesc_to_odom still publishes the /odom TOPIC, which is what
    # the EKF consumes as its velocity input.
    publish_tf: false
    use_servo_cmd_to_calc_angular_velocity: true
    wheelbase: .25

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position
    max_acceleration: 2.5
    throttle_smoother_rate: 75.0
    max_servo_speed: 3.2
    servo_smoother_rate: 75.0
